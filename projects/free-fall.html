<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유낙하 다중섬광사진 및 궤적 분석</title>
    <!-- 그래프 작성을 위한 Chart.js 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }
        input[type="file"] {
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .fps-control {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        .fps-control input {
            width: 60px;
            padding: 5px;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #btn-strobo { background-color: #6f42c1; }
        #btn-strobo:hover { background-color: #5a32a3; }
        
        #video-container, #strobo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 4px;
            cursor: crosshair;
            background-color: #fff;
            max-width: 100%;
            height: auto;
        }
        video { display: none; }
        
        #status-msg {
            font-size: 1.2em;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
        }
        .chart-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: none;
        }
        #loading-overlay {
            display: none;
            color: #28a745;
            font-weight: bold;
            margin-top: 10px;
        }
        .section-title {
            margin-top: 30px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>자유낙하 궤적 분석 & 다중섬광사진</h1>
        <p>스마트폰 영상을 업로드하여 물체의 궤적을 분석하고 다중섬광사진을 합성해 보세요.</p>
        
        <div class="controls">
            <!-- 사진이 선택되지 않도록 video/* 로 다시 제한 -->
            <input type="file" id="video-upload" accept="video/*">
            <div class="fps-control">
                <label for="fps-input">영상 FPS:</label>
                <input type="number" id="fps-input" value="30" min="1" max="240">
            </div>
            <button id="btn-extract">영상 분석 준비</button>
            <button id="btn-reset">🔄 초기화</button>
            <button id="btn-csv" style="display:none; background-color: #28a745;">📊 CSV 다운로드</button>
            <button id="btn-strobo" style="display:none;">📸 다중섬광사진 합성</button>
        </div>

        <div id="status-msg">1단계: 동영상 파일을 선택하고 '영상 분석 준비'를 누르세요.</div>
        <div id="loading-overlay">영상을 추출하고 있습니다... <span id="progress-text"></span></div>

        <div id="video-container">
            <video id="video" playsinline preload="auto"></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>

        <div id="strobo-container" style="display:none; width:100%;">
            <h2 class="section-title">합성된 다중섬광사진</h2>
            <p>※ 배경이 밝고 카메라가 고정되어 있을수록 결과물이 깨끗합니다.</p>
            <canvas id="canvas-strobo"></canvas><br>
            <button id="btn-download-strobo" style="margin-top: 10px; background-color: #17a2b8;">🖼️ 사진 다운로드</button>
        </div>

        <div class="chart-container" id="chart-wrapper">
            <h2 class="section-title">자유낙하 t-y 그래프</h2>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('video-upload');
        const fpsInput = document.getElementById('fps-input');
        const btnExtract = document.getElementById('btn-extract');
        const btnReset = document.getElementById('btn-reset');
        const btnCsv = document.getElementById('btn-csv');
        const btnStrobo = document.getElementById('btn-strobo');
        const btnDownloadStrobo = document.getElementById('btn-download-strobo');
        const statusMsg = document.getElementById('status-msg');
        const loadingOverlay = document.getElementById('loading-overlay');
        const progressText = document.getElementById('progress-text');
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const canvasStrobo = document.getElementById('canvas-strobo');
        const ctxStrobo = canvasStrobo.getContext('2d');
        const stroboContainer = document.getElementById('strobo-container');
        
        const chartWrapper = document.getElementById('chart-wrapper');
        
        let frames = [];
        let dataPoints = [];
        let analyzeIndex = -1;
        let chartInstance = null;
        let fps = 30;
        let frameInterval = 1 / fps;
        let extractionTime = 0;

        const MAX_DIMENSION = 800; 
        const MAX_FRAMES = 150; 

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            statusMsg.innerText = "영상이 로드되었습니다. '영상 분석 준비' 버튼을 누르세요.";
        });

        video.addEventListener('error', () => {
            alert("브라우저에서 지원하지 않는 영상 포맷이거나 파일이 손상되었습니다. 다른 영상을 선택해 주세요.");
            btnExtract.disabled = false;
            statusMsg.innerText = "에러: 영상을 읽을 수 없습니다.";
        });

        btnExtract.addEventListener('click', () => {
            if (!video.src) { alert("동영상 파일을 선택해주세요."); return; }

            fps = parseInt(fpsInput.value) || 30;
            frameInterval = 1 / fps;
            frames = []; dataPoints = []; analyzeIndex = -1; extractionTime = 0;

            btnExtract.disabled = true; fileInput.disabled = true; fpsInput.disabled = true;
            loadingOverlay.style.display = 'block';
            statusMsg.innerText = "2단계: 프레임 추출 중...";

            let vw = video.videoWidth; let vh = video.videoHeight;
            if (vw > vh) { if (vw > MAX_DIMENSION) { vh *= MAX_DIMENSION / vw; vw = MAX_DIMENSION; } } 
            else { if (vh > MAX_DIMENSION) { vw *= MAX_DIMENSION / vh; vh = MAX_DIMENSION; } }
            
            canvas.width = vw; canvas.height = vh;
            canvasStrobo.width = vw; canvasStrobo.height = vh;

            video.currentTime = 0;
            video.addEventListener('seeked', extractFrameListener);
        });

        function extractFrameListener() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            frames.push({
                img: ctx.getImageData(0, 0, canvas.width, canvas.height),
                time: extractionTime 
            });
            progressText.innerText = `(${frames.length} 프레임)`;
            extractionTime += frameInterval;

            if (extractionTime <= video.duration && frames.length < MAX_FRAMES) {
                video.currentTime = extractionTime;
            } else {
                video.removeEventListener('seeked', extractFrameListener);
                finishExtraction();
            }
        }

        function finishExtraction() {
            loadingOverlay.style.display = 'none';
            if (frames.length > 0) {
                analyzeIndex = 0;
                statusMsg.innerText = `3단계: 총 ${frames.length}프레임. 물체를 클릭하여 궤적을 그리거나 '다중섬광사진 합성'을 누르세요.`;
                renderAnalyzeFrame();
                btnStrobo.style.display = 'inline-block'; 
            } else {
                statusMsg.innerText = "프레임 추출 실패. 영상 포맷을 확인해주세요.";
                btnExtract.disabled = false;
            }
        }

        function renderAnalyzeFrame() {
            ctx.putImageData(frames[analyzeIndex].img, 0, 0);
            ctx.fillStyle = 'red';
            for (let i = 0; i < dataPoints.length; i++) {
                ctx.beginPath(); ctx.arc(dataPoints[i].x, dataPoints[i].y, 5, 0, 2 * Math.PI); ctx.fill();
                if (i > 0) {
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(dataPoints[i-1].x, dataPoints[i-1].y); ctx.lineTo(dataPoints[i].x, dataPoints[i].y); ctx.stroke();
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            if (analyzeIndex >= 0 && analyzeIndex < frames.length) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX; const clickY = (e.clientY - rect.top) * scaleY;

                dataPoints.push({ time: frames[analyzeIndex].time, x: clickX, y: clickY });
                analyzeIndex++;
                
                if (analyzeIndex < frames.length) {
                    statusMsg.innerText = `분석 중 (${analyzeIndex + 1} / ${frames.length} 프레임)`;
                    renderAnalyzeFrame();
                } else {
                    statusMsg.innerText = "분석 완료!";
                    renderAnalyzeFrame(); 
                    drawGraph();
                    btnCsv.style.display = 'inline-block';
                }
            }
        });

        // 다중섬광사진 합성 로직
        btnStrobo.addEventListener('click', () => {
            if (frames.length === 0) return;
            stroboContainer.style.display = 'block';
            
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width; offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');

            offCtx.putImageData(frames[0].img, 0, 0);
            ctxStrobo.drawImage(offCanvas, 0, 0);
            
            ctxStrobo.globalCompositeOperation = 'darken';

            for (let i = 1; i < frames.length; i++) {
                offCtx.putImageData(frames[i].img, 0, 0);
                ctxStrobo.drawImage(offCanvas, 0, 0);
            }
            
            ctxStrobo.globalCompositeOperation = 'source-over';
            
            // 객체 중심점과 타임스탬프 표시
            if (dataPoints.length > 0) {
                const startTime = dataPoints[0].time;

                for (let i = 0; i < dataPoints.length; i++) {
                    // 점 그리기
                    ctxStrobo.fillStyle = 'red';
                    ctxStrobo.beginPath(); 
                    ctxStrobo.arc(dataPoints[i].x, dataPoints[i].y, 5, 0, 2 * Math.PI); 
                    ctxStrobo.fill();

                    // 타임스탬프 텍스트 그리기 (가독성을 위한 그림자 효과 추가)
                    const timeText = (dataPoints[i].time - startTime).toFixed(3) + "s";
                    ctxStrobo.font = "bold 16px 'Segoe UI', Arial, sans-serif";
                    ctxStrobo.fillStyle = "yellow";
                    ctxStrobo.shadowColor = "black";
                    ctxStrobo.shadowBlur = 4;
                    ctxStrobo.shadowOffsetX = 1;
                    ctxStrobo.shadowOffsetY = 1;
                    
                    // 점의 오른쪽 약간 아래에 텍스트 배치
                    ctxStrobo.fillText(timeText, dataPoints[i].x + 12, dataPoints[i].y + 6);
                    
                    // 그림자 초기화 (선 그리기 위해)
                    ctxStrobo.shadowColor = "transparent";
                    ctxStrobo.shadowBlur = 0;
                    ctxStrobo.shadowOffsetX = 0;
                    ctxStrobo.shadowOffsetY = 0;

                    // 궤적 선 그리기
                    if (i > 0) {
                        ctxStrobo.strokeStyle = 'rgba(255, 0, 0, 0.5)'; 
                        ctxStrobo.lineWidth = 2;
                        ctxStrobo.beginPath(); 
                        ctxStrobo.moveTo(dataPoints[i-1].x, dataPoints[i-1].y); 
                        ctxStrobo.lineTo(dataPoints[i].x, dataPoints[i].y); 
                        ctxStrobo.stroke();
                    }
                }
            }
            
            stroboContainer.scrollIntoView({ behavior: 'smooth' });
        });

        btnDownloadStrobo.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'stroboscopic_image.png';
            link.href = canvasStrobo.toDataURL('image/png');
            link.click();
        });

        function drawGraph() {
            chartWrapper.style.display = 'block';
            const ctxChart = document.getElementById('chart').getContext('2d');
            const startTime = dataPoints[0].time;
            const scatterData = dataPoints.map(dp => ({
                x: (dp.time - startTime).toFixed(4), y: dp.y.toFixed(1)
            }));

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctxChart, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '시간(t)에 따른 Y좌표 (Pixel)', data: scatterData,
                        backgroundColor: 'red', borderColor: 'red', showLine: true, fill: false, tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'linear', position: 'bottom', title: { display: true, text: '경과 시간 (초)', font: {size: 14} } },
                        y: { reverse: true, title: { display: true, text: '낙하 거리 Y (Pixel)', font: {size: 14} } }
                    }
                }
            });
        }

        btnCsv.addEventListener('click', () => {
            const startTime = dataPoints[0].time;
            let csvContent = "data:text/csv;charset=utf-8,Time (s),X Position (px),Y Position (px)\n";
            dataPoints.forEach(row => { csvContent += `${(row.time - startTime).toFixed(4)},${row.x.toFixed(1)},${row.y.toFixed(1)}\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", "free_fall_analysis.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        });

        btnReset.addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
