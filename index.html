<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arduino 웹 실험실 - 가속도계, 환경 센서, 자유낙하 실험">
    <title>아두이노 웹 실험실</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-bar {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-status {
            font-size: 1.05em;
            font-weight: 600;
            color: #333;
        }
        .auth-btn {
            padding: 8px 16px;
            font-size: 0.95em;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-google {
            background-color: #4285F4;
            color: white;
        }
        .btn-google:hover {
            background-color: #357ae8;
        }
        .btn-logout {
            background-color: #dc3545;
            color: white;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
        .records-section {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        .records-section h3 {
            margin-top: 0;
            color: #007BFF;
        }
        .experiment-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }
        .experiment-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 구글 로그인 및 사용자 인증 상태 바 -->
        <div class="auth-bar">
            <div id="userInfo" class="user-status">🔒 구글 로그인이 필요합니다</div>
            <div>
                <button id="signInBtn" class="auth-btn btn-google" onclick="signInWithGoogle()">Sign in with Google</button>
                <button id="signOutBtn" class="auth-btn btn-logout" onclick="signOut()" style="display:none;">Sign out</button>
            </div>
        </div>

        <h1>아두이노 웹 실험실</h1>
        <p>환영합니다! 아래에서 수행할 실험 프로젝트를 선택하세요.</p>
        <p>프로젝트를 시작하기 전에, <a href="uploader.html">펌웨어 업로더</a> 페이지에서 아두이노를 먼저 준비해주세요.</p>

        <h2>프로젝트 목록</h2>
        <ul class="project-list">
            <li><a href="projects/accelerometer-lab.html">➡️ 가속도계 데이터 분석</a></li>
            <li><a href="projects/environment-lab.html">➡️ 환경 센서 실시간 모니터</a></li>
            <li><a href="projects/free-fall.html">➡️ 자유낙하 궤적 분석 (스마트폰 영상)</a></li>
            <li><a href="projects/phone-accelerometer.html">➡️ 스마트폰 가속도 센서 실험</a></li>
        </ul>

        <!-- 학생 실험 데이터 기록 영역 -->
        <div id="studentRecordsSection" class="records-section">
            <h3>🧪 학생 실험 기록 관리</h3>
            <p id="recordsNotice">구글 로그인 시 작성된 실험 기록을 저장하고 조회할 수 있습니다.</p>
            <div id="experimentsList" style="display:none;"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            projectId: "web-experiment-f9b24",
            appId: "1:718758606428:web:e11ed8d0b64a471ee65899",
            storageBucket: "web-experiment-f9b24.firebasestorage.app",
            apiKey: "AIzaSyCYVme6ZP-iyspRmHTtuUSsKXe7K_D0vJQ",
            authDomain: "web-experiment-f9b24.firebaseapp.com",
            messagingSenderId: "718758606428"
        };

        let auth = null;
        let db = null;
        let currentUser = null;

        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') return;
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();

                auth.onAuthStateChanged(user => {
                    currentUser = user;
                    const userInfo = document.getElementById('userInfo');
                    const signInBtn = document.getElementById('signInBtn');
                    const signOutBtn = document.getElementById('signOutBtn');
                    const expList = document.getElementById('experimentsList');
                    const notice = document.getElementById('recordsNotice');

                    if (user) {
                        userInfo.textContent = `👤 ${user.displayName || user.email} 님 로그인됨`;
                        signInBtn.style.display = 'none';
                        signOutBtn.style.display = 'inline-block';
                        if (notice) notice.textContent = '학생의 저장된 실험 기록 목록입니다:';
                        loadStudentExperiments();
                    } else {
                        userInfo.textContent = '🔒 구글 로그인이 필요합니다';
                        signInBtn.style.display = 'inline-block';
                        signOutBtn.style.display = 'none';
                        if (expList) expList.style.display = 'none';
                        if (notice) notice.textContent = '구글 로그인 시 작성된 실험 기록을 저장하고 조회할 수 있습니다.';
                    }
                });
            } catch (e) {
                console.error('Firebase init error:', e);
            }
        }

        function signInWithGoogle() {
            if (!auth) return alert('Firebase 초기화 오류');
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert('로그인 실패: ' + err.message));
        }

        function signOut() {
            if (!auth) return;
            auth.signOut();
        }

        async function loadStudentExperiments() {
            const expList = document.getElementById('experimentsList');
            if (!auth || !currentUser || !expList) return;
            expList.style.display = 'block';
            expList.innerHTML = '<p style="color:#6c757d;">실험 기록을 불러오는 중...</p>';

            try {
                const snap = await db.collection('experiments')
                    .where('userId', '==', currentUser.uid)
                    .get();

                if (snap.empty) {
                    expList.innerHTML = '<p style="color:#6c757d;">아직 저장된 실험 기록이 없습니다.</p>';
                    return;
                }

                let html = '<ul class="experiment-list">';
                snap.forEach(doc => {
                    const data = doc.data();
                    const dateStr = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate().toLocaleString('ko-KR') : '방금 전';
                    const expName = data.experimentName || data.tab || '아두이노 실험';
                    html += `
                        <li class="experiment-item">
                            <div>
                                <strong>${expName}</strong>
                                <span style="font-size:0.85em; color:#6c757d; margin-left:10px;">${dateStr}</span>
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
                expList.innerHTML = html;
            } catch (e) {
                console.error('Load experiments error:', e);
                expList.innerHTML = '<p style="color:#dc3545;">실험 기록 불러오기 실패: ' + e.message + '</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
</body>
</html>
