    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            projectId: "web-experiment-f9b24",
            appId: "1:718758606428:web:e11ed8d0b64a471ee65899",
            storageBucket: "web-experiment-f9b24.firebasestorage.app",
            apiKey: "AIzaSyCYVme6ZP-iyspRmHTtuUSsKXe7K_D0vJQ",
            authDomain: "web-experiment-f9b24.firebaseapp.com",
            messagingSenderId: "718758606428"
        };

        let auth = null;
        let db = null;
        let currentUser = null;
        let isTeacherUser = false;
        let currentViewMode = 'teacher'; // 'teacher' or 'student'

        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') return;
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();

                auth.onAuthStateChanged(async user => {
                    currentUser = user;
                    if (user) {
                        isTeacherUser = await checkIsTeacher(user.uid);
                        const savedMode = sessionStorage.getItem('viewMode');
                        if (savedMode && (savedMode === 'teacher' || savedMode === 'student')) {
                            currentViewMode = savedMode;
                        } else {
                            currentViewMode = isTeacherUser ? 'teacher' : 'student';
                        }
                        updateUIForUser();
                    } else {
                        isTeacherUser = false;
                        currentViewMode = 'student';
                        updateUIForUser();
                    }
                });
            } catch (e) {
                console.error('Firebase init error:', e);
            }
        }

        function updateUIForUser() {
            const userInfo = document.getElementById('userInfo');
            const signInBtn = document.getElementById('signInBtn');
            const signOutBtn = document.getElementById('signOutBtn');
            const modeToggleBtn = document.getElementById('modeToggleBtn');
            const expList = document.getElementById('experimentsList');
            const notice = document.getElementById('recordsNotice');
            const title = document.getElementById('recordsTitle');

            if (currentUser) {
                signInBtn.style.display = 'none';
                signOutBtn.style.display = 'inline-block';

                if (isTeacherUser) {
                    modeToggleBtn.style.display = 'inline-block';
                    if (currentViewMode === 'teacher') {
                        modeToggleBtn.textContent = '?럳 ?숈깮??紐⑤뱶濡??꾪솚';
                        const roleBadge = '<span class="role-badge role-teacher">?뫅?랅윆?援먯궗 (援먯궗??紐⑤뱶)</span>';
                        userInfo.innerHTML = `?뫀 ${currentUser.displayName || currentUser.email} ${roleBadge}`;
                        title.textContent = '?뱥 援먯궗 ??쒕낫??- ?꾩껜 ?숈깮 ?쒖텧 ?꾪솴';
                        notice.textContent = '紐⑤뱺 ?숈깮???쒖텧???ㅽ뿕 ?곗씠??紐⑸줉?낅땲??';
                        loadTeacherDashboard();
                    } else {
                        modeToggleBtn.textContent = '?뫅?랅윆?援먯궗??紐⑤뱶濡??꾪솚';
                        const roleBadge = '<span class="role-badge role-student">?뫅?랅윆?援먯궗 (?숈깮??紐⑤뱶 泥댄뿕)</span>';
                        userInfo.innerHTML = `?뫀 ${currentUser.displayName || currentUser.email} ${roleBadge}`;
                        title.textContent = '?㎦ ???ㅽ뿕 湲곕줉 愿由?(?숈깮???붾㈃)';
                        notice.textContent = '?닿? ??ν븳 ?ㅽ뿕 湲곕줉 紐⑸줉?낅땲??(?숈깮???붾㈃ 誘몃━蹂닿린):';
                        loadStudentExperiments();
                    }
                } else {
                    modeToggleBtn.style.display = 'none';
                    const roleBadge = '<span class="role-badge role-student">?럳 ?숈깮</span>';
                    userInfo.innerHTML = `?뫀 ${currentUser.displayName || currentUser.email} ${roleBadge}`;
                    title.textContent = '?㎦ ???ㅽ뿕 湲곕줉 愿由?;
                    notice.textContent = '?닿? ??ν븳 ?ㅽ뿕 湲곕줉 紐⑸줉?낅땲??';
                    loadStudentExperiments();
                }
            } else {
                modeToggleBtn.style.display = 'none';
                userInfo.textContent = '?뵏 援ш? 濡쒓렇?몄씠 ?꾩슂?⑸땲??;
                signInBtn.style.display = 'inline-block';
                signOutBtn.style.display = 'none';
                if (expList) expList.style.display = 'none';
                title.textContent = '?㎦ ?ㅽ뿕 ?곗씠?????& 議고쉶';
                notice.textContent = '援ш? 濡쒓렇?????묒꽦???ㅽ뿕 湲곕줉????ν븯怨?議고쉶?????덉뒿?덈떎.';
            }
        }

        function toggleViewMode() {
            if (!isTeacherUser) return;
            currentViewMode = (currentViewMode === 'teacher') ? 'student' : 'teacher';
            sessionStorage.setItem('viewMode', currentViewMode);
            updateUIForUser();
        }

        async function checkIsTeacher(uid) {
            try {
                const doc = await db.collection('roles').doc(uid).get();
                return doc.exists && doc.data().isTeacher === true;
            } catch (e) {
                return false;
            }
        }

        function signInWithGoogle() {
            if (!auth) return alert('Firebase 珥덇린???ㅻ쪟');
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert('濡쒓렇???ㅽ뙣: ' + err.message));
        }

        function signOut() {
            if (!auth) return;
            auth.signOut();
        }

        async function loadStudentExperiments() {
            const expList = document.getElementById('experimentsList');
            if (!auth || !currentUser || !expList) return;
            expList.style.display = 'block';
            expList.innerHTML = '<p style="color:#6c757d;">???ㅽ뿕 湲곕줉??遺덈윭?ㅻ뒗 以?..</p>';

            try {
                const snap = await db.collection('experiments')
                    .where('userId', '==', currentUser.uid)
                    .get();

                if (snap.empty) {
                    expList.innerHTML = '<p style="color:#6c757d;">?꾩쭅 ??λ맂 ?ㅽ뿕 湲곕줉???놁뒿?덈떎. ?ㅽ뿕 ?섏씠吏?먯꽌 ?곗씠?곕? ??ν빐蹂댁꽭??</p>';
                    return;
                }

                renderExperiments(snap, false);
            } catch (e) {
                console.error('Load experiments error:', e);
                expList.innerHTML = '<p style="color:#dc3545;">?ㅽ뿕 湲곕줉 遺덈윭?ㅺ린 ?ㅽ뙣: ' + e.message + '</p>';
            }
        }

        async function loadTeacherDashboard() {
            const expList = document.getElementById('experimentsList');
            if (!auth || !currentUser || !expList) return;
            expList.style.display = 'block';
            expList.innerHTML = '<p style="color:#6c757d;">?꾩껜 ?숈깮???쒖텧 ?곗씠?곕? 遺덈윭?ㅻ뒗 以?..</p>';

            try {
                const snap = await db.collection('experiments').get();

                if (snap.empty) {
                    expList.innerHTML = '<p style="color:#6c757d;">?쒖텧???숈깮 ?ㅽ뿕 湲곕줉???놁뒿?덈떎.</p>';
                    return;
                }

                renderExperiments(snap, true);
            } catch (e) {
                console.error('Teacher dashboard load error:', e);
                expList.innerHTML = '<p style="color:#dc3545;">?숈깮 湲곕줉 遺덈윭?ㅺ린 ?ㅽ뙣: ' + e.message + '</p>';
            }
        }

        function renderExperiments(snap, isTeacher) {
            const expList = document.getElementById('experimentsList');
            let html = '<ul class="experiment-list">';
            
            // ?좎쭨 ?ㅻ쫫李⑥닚/?대┝李⑥닚 ?뺣젹
            const docs = [];
            snap.forEach(doc => docs.push(doc.data()));
            docs.sort((a, b) => {
                const ta = a.timestamp && a.timestamp.toDate ? a.timestamp.toDate().getTime() : 0;
                const tb = b.timestamp && b.timestamp.toDate ? b.timestamp.toDate().getTime() : 0;
                return tb - ta;
            });

            docs.forEach(data => {
                const dateStr = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate().toLocaleString('ko-KR') : '諛⑷툑 ??;
                const expName = data.experimentName || data.tab || '?꾨몢?대끂 ?ㅽ뿕';
                const studentLabel = isTeacher ? `<span class="student-info">?뫀 <strong>${data.userEmail || data.userId}</strong></span>` : '';
                
                let detailSummary = '';
                if (data.dataSummary) {
                    detailSummary = `?뱤 ?붿빟: ${data.dataSummary}`;
                } else if (data.trialsCount !== undefined) {
                    detailSummary = `?뱤 ?뚯감 ?? ${data.trialsCount}??;
                } else {
                    detailSummary = '?뱤 ????꾨즺??;
                }

                html += `
                    <li class="experiment-item">
                        <div class="experiment-header">
                            <div>
                                <strong style="font-size:1.05em; color:#007BFF;">${expName}</strong>
                                ${studentLabel}
                            </div>
                            <span style="font-size:0.85em; color:#6c757d;">?븩 ${dateStr}</span>
                        </div>
                        <div class="exp-details">
                            ${detailSummary}
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            expList.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
